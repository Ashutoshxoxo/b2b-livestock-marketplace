spring.application.name=livestock-marketplace

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/b2b_livestock_marketplace
spring.datasource.username=marketplace_app
spring.datasource.password=Ashutosh@48
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=15

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info